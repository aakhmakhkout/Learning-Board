<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Noumaan · Backend Journey</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <meta
      name="theme-color"
      content="#e9e4d9"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#121212"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Learning Board" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <style>
      @font-face {
        font-family: "Caveat";
        font-weight: 500;
        font-style: normal;
        font-display: swap;
        src: url(fonts/caveat-500.woff2) format("woff2");
      }
      @font-face {
        font-family: "Caveat";
        font-weight: 700;
        font-style: normal;
        font-display: swap;
        src: url(fonts/caveat-700.woff2) format("woff2");
      }
      @font-face {
        font-family: "DM Sans";
        font-weight: 400;
        font-style: normal;
        font-display: swap;
        src: url(fonts/dm-sans-400.woff2) format("woff2");
      }
      @font-face {
        font-family: "DM Sans";
        font-weight: 500;
        font-style: normal;
        font-display: swap;
        src: url(fonts/dm-sans-500.woff2) format("woff2");
      }
      @font-face {
        font-family: "DM Sans";
        font-weight: 700;
        font-style: normal;
        font-display: swap;
        src: url(fonts/dm-sans-700.woff2) format("woff2");
      }
      @font-face {
        font-family: "Special Elite";
        font-weight: 400;
        font-style: normal;
        font-display: swap;
        src: url(fonts/special-elite-400.woff2) format("woff2");
      }
      @font-face {
        font-family: "Bricolage Grotesque";
        font-weight: 600;
        font-style: normal;
        font-display: swap;
        src: url(fonts/bricolage-600.woff2) format("woff2");
      }
      @font-face {
        font-family: "Bricolage Grotesque";
        font-weight: 800;
        font-style: normal;
        font-display: swap;
        src: url(fonts/bricolage-800.woff2) format("woff2");
      }
    </style>
    <style>
      :root {
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        --bg: #e9e4d9;
        --grid: rgba(30, 30, 30, 0.07);
        --card: #f6f2e8;
        --ink: #171717;
        --mut: #6b655a;
        --line: rgba(0, 0, 0, 0.16);
        --cable: rgba(0, 0, 0, 0.09);
        --red: #d9432a;
        --grn: #0f5a43;
        --org: #ef8a2f;
        --ol: #5b6b46;
        --nk: #26366b;
        --hd: "Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
        --bd: "DM Sans", system-ui, sans-serif;
        --tw: "Special Elite", "Courier New", monospace;
        --hw: Caveat, "Segoe Script", "Bradley Hand", cursive;
        --pl:
          1% 5%, 32% 0, 64% 3%, 99% 0, 100% 38%, 97% 70%, 100% 99%, 62% 100%,
          30% 96%, 0 100%, 3% 62%, 0 32%;
        --pi:
          2% 4%, 30% 1%, 66% 4%, 98% 1%, 99% 40%, 97% 72%, 99% 98%, 62% 99%,
          30% 97%, 1% 99%, 3% 60%, 1% 30%;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #121212;
          --grid: rgba(255, 255, 255, 0.05);
          --card: #1c1c1c;
          --ink: #efeae0;
          --mut: #9a948a;
          --line: rgba(255, 255, 255, 0.16);
          --cable: rgba(255, 255, 255, 0.1);
        }
      }
      :root[data-theme="dark"] {
        --bg: #121212;
        --grid: rgba(255, 255, 255, 0.05);
        --card: #1c1c1c;
        --ink: #efeae0;
        --mut: #9a948a;
        --line: rgba(255, 255, 255, 0.16);
        --cable: rgba(255, 255, 255, 0.1);
      }
      * {
        box-sizing: border-box;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      *::-webkit-scrollbar {
        display: none;
        width: 0;
        height: 0;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        min-height: 100%;
        font: 15px/1.5 var(--bd);
        color: var(--ink);
        background:
          linear-gradient(var(--grid) 1px, transparent 1px) 0 0/32px 32px,
          linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/32px 32px,
          var(--bg);
      }
      #bgc {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      #bgc path {
        fill: none;
        stroke: var(--cable);
        stroke-width: 3;
      }
      .w {
        position: relative;
        max-width: 1120px;
        margin: auto;
        padding: 0 20px 60px;
      }
      nav {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
        padding: 16px 0;
      }
      .logo {
        width: 34px;
        height: 34px;
        border-radius: 50% 50% 50% 8px;
        background: var(--red);
        color: #fff;
        font: 800 18px/34px var(--hd);
        text-align: center;
        margin-right: 8px;
        transform: rotate(-8deg);
      }
      .dots {
        display: flex;
        gap: 5px;
        margin-right: auto;
      }
      .dots i {
        width: 9px;
        height: 9px;
        border-radius: 50%;
      }
      nav button {
        font: 500 14px var(--bd);
        color: var(--ink);
        background: none;
        border: 0;
        padding: 6px 12px;
        border-radius: 20px;
        cursor: pointer;
        transition: background 0.2s;
      }
      nav button:hover {
        background: var(--line);
      }
      nav button.pri {
        background: var(--ink);
        color: var(--bg);
      }
      #hero {
        display: grid;
        grid-template-columns: 1fr minmax(240px, 320px);
        gap: 30px;
        align-items: center;
        padding: 20px 0 10px;
      }
      .tag {
        display: inline-block;
        font: 400 12px var(--tw);
        border: 1.5px solid var(--ink);
        padding: 2px 10px;
        background: var(--card);
        text-transform: uppercase;
        transform: rotate(3deg);
        margin: 0 6px 10px 0;
      }
      .tag + .tag {
        transform: rotate(-2deg);
      }
      h1 {
        margin: 0;
        font: 800 clamp(44px, 8vw, 88px)/0.95 var(--hd);
        letter-spacing: -0.03em;
      }
      h1 em {
        font-style: normal;
        color: var(--red);
      }
      .lead {
        max-width: 540px;
        color: var(--mut);
        margin: 14px 0 18px;
      }
      #seg {
        display: flex;
        gap: 4px;
        max-width: 540px;
      }
      #seg i {
        height: 8px;
        background: var(--line);
        position: relative;
        overflow: hidden;
        border-radius: 1px;
      }
      #seg b {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        background: var(--pc);
        transition: width 0.4s;
      }
      #sg {
        font: 400 12px var(--tw);
        color: var(--mut);
        margin-top: 8px;
      }
      .cut {
        filter: drop-shadow(0 5px 7px rgba(0, 0, 0, 0.28));
      }
      .cut .cp {
        background: var(--oc, var(--red));
        padding: 7px;
        clip-path: polygon(var(--pl));
      }
      .cut .in {
        background: #f6f2e8;
        color: #171717;
        padding: 13px 14px 15px;
        clip-path: polygon(var(--pi));
      }
      .nt {
        font: 400 11px var(--tw);
        color: var(--oc, var(--red));
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .hd {
        font: 800 17px/1.15 var(--hd);
        margin: 2px 0 4px;
        letter-spacing: -0.01em;
      }
      .in p {
        margin: 4px 0 0;
        font-size: 13.5px;
        line-height: 1.4;
      }
      #nx {
        transform: rotate(1.5deg);
      }
      .sec {
        display: flex;
        align-items: baseline;
        gap: 12px;
        margin: 34px 0 10px;
      }
      .sec h2 {
        margin: 0;
        font: 800 28px var(--hd);
        letter-spacing: -0.02em;
      }
      .sec span {
        color: var(--mut);
        font: 400 12px var(--tw);
      }
      #cork {
        position: relative;
        isolation: isolate;
        z-index: 0;
        border: 9px solid #0e2f25;
        border-radius: 8px;
        touch-action: pan-y;
        background:
          linear-gradient(rgba(255, 255, 255, 0.34) 1px, transparent 1px) 0
            0/120px 120px,
          linear-gradient(90deg, rgba(255, 255, 255, 0.34) 1px, transparent 1px)
            0 0/120px 120px,
          linear-gradient(rgba(255, 255, 255, 0.13) 1px, transparent 1px) 0
            0/24px 24px,
          linear-gradient(90deg, rgba(255, 255, 255, 0.13) 1px, transparent 1px)
            0 0/24px 24px,
          radial-gradient(
            circle at 0 100%,
            transparent 139px,
            rgba(255, 255, 255, 0.3) 140px,
            transparent 142px,
            transparent 199px,
            rgba(255, 255, 255, 0.22) 200px,
            transparent 202px
          ),
          radial-gradient(ellipse at 50% 30%, #2a7a5d, #1b5c46 70%);
        box-shadow:
          0 34px 50px -14px rgba(0, 0, 0, 0.6),
          0 3px 0 #0a2219,
          inset 0 0 0 2px rgba(255, 255, 255, 0.18),
          inset 0 0 60px rgba(0, 0, 0, 0.35);
      }
      #cork:before,
      #cork:after {
        content: "";
        position: absolute;
        z-index: 0;
        pointer-events: none;
        background-repeat: no-repeat;
      }
      #cork:before {
        left: 0;
        right: 0;
        top: 0;
        height: 14px;
        background-image:
          repeating-linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.55) 0 1px,
            transparent 1px 12px
          ),
          repeating-linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.85) 0 1.5px,
            transparent 1.5px 60px
          );
        background-size:
          100% 6px,
          100% 12px;
      }
      #cork:after {
        left: 0;
        top: 0;
        bottom: 0;
        width: 14px;
        background-image:
          repeating-linear-gradient(
            180deg,
            rgba(255, 255, 255, 0.55) 0 1px,
            transparent 1px 12px
          ),
          repeating-linear-gradient(
            180deg,
            rgba(255, 255, 255, 0.85) 0 1.5px,
            transparent 1.5px 60px
          );
        background-size:
          6px 100%,
          12px 100%;
      }
      .mcap {
        position: absolute;
        right: 16px;
        bottom: 10px;
        font: 400 11px var(--tw);
        color: rgba(255, 255, 255, 0.55);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        pointer-events: none;
      }
      .note {
        position: absolute;
        z-index: 1;
        transform: rotate(var(--r));
        cursor: grab;
        transition: transform 0.35s var(--spring);
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      .note:hover {
        transform: rotate(0) scale(1.04);
        z-index: 3;
      }
      .note.drag {
        cursor: grabbing;
        transform: rotate(0) scale(1.07);
        translate: var(--dx, 0px) var(--dy, 0px);
        will-change: transform, translate;
      }
      .note .in {
        user-select: none;
      }
      .nx {
        position: absolute;
        right: 12px;
        top: 10px;
        font: 12px var(--bd);
        cursor: pointer;
        opacity: 0;
        z-index: 2;
        text-decoration: none;
        color: #171717;
      }
      .note:hover .nx {
        opacity: 0.7;
      }
      .r {
        --oc: var(--red);
      }
      .g {
        --oc: var(--grn);
      }
      .o {
        --oc: var(--org);
      }
      .l {
        --oc: var(--ol);
      }
      .k {
        --oc: #171717;
      }
      .note.g {
        --oc: #ece3c3;
      }
      .note.l {
        --oc: #c5d16d;
      }
      .note .nt {
        color: #6b5a4a;
      }
      #ov {
        position: fixed;
        inset: 0;
        background: rgba(10, 10, 10, 0.5);
        backdrop-filter: blur(3px);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s;
        padding: calc(12px + env(safe-area-inset-top, 0px)) 10px 12px;
        z-index: 100;
      }
      #ov.on {
        opacity: 1;
        pointer-events: auto;
      }
      #pn {
        max-height: 100%;
        overflow: auto;
        width: min(96vw, 940px);
        transform: translateY(30px) rotate(-0.8deg) scale(0.97);
        transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.1);
      }
      #ov.on #pn {
        transform: none;
      }
      #x {
        position: fixed;
        top: calc(10px + env(safe-area-inset-top, 0px));
        right: 14px;
        z-index: 101;
        background: var(--card);
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 50%;
        width: 38px;
        height: 38px;
        font-size: 16px;
        cursor: pointer;
      }
      .sheet {
        background:
          linear-gradient(var(--grid) 1px, transparent 1px) 0 0/24px 24px,
          linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/24px 24px,
          var(--card);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 22px 24px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      }
      .sheet h2 {
        margin: 0 0 4px;
        font: 800 30px var(--hd);
        letter-spacing: -0.02em;
      }
      .sub {
        color: var(--mut);
        font: 400 12px var(--tw);
        margin-bottom: 14px;
      }
      body {
        overflow-x: hidden;
      }
      .note {
        max-width: 260px;
      }
      #cork.cmp .cut .cp {
        padding: 5px;
      }
      #cork.cmp .cut .in {
        padding: 8px 9px 10px;
      }
      #cork.cmp .hd {
        font-size: 12.5px;
        margin: 1px 0 2px;
      }
      #cork.cmp .in p {
        font-size: 10.5px;
        line-height: 1.3;
      }
      #cork.cmp .nt {
        font-size: 8.5px;
      }
      .book {
        --bp: 16px;
        position: relative;
        perspective: 1800px;
        display: flex;
        padding: var(--bp);
        border-radius: 8px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
        background:
          radial-gradient(circle at 9px 9px, #e0b85a 3px, transparent 4px),
          radial-gradient(
            circle at calc(100% - 9px) 9px,
            #e0b85a 3px,
            transparent 4px
          ),
          radial-gradient(
            circle at 9px calc(100% - 9px),
            #e0b85a 3px,
            transparent 4px
          ),
          radial-gradient(
            circle at calc(100% - 9px) calc(100% - 9px),
            #e0b85a 3px,
            transparent 4px
          ),
          linear-gradient(
            90deg,
            transparent calc(100% - 13px),
            #a3281c calc(100% - 13px),
            #7e1d14 calc(100% - 5px),
            transparent calc(100% - 5px)
          ),
          repeating-linear-gradient(
            45deg,
            rgba(255, 255, 255, 0.035) 0 2px,
            transparent 2px 5px
          ),
          #0f3d30;
      }
      .book:before {
        content: "";
        position: absolute;
        inset: 5px;
        border: 2px dashed rgba(224, 184, 90, 0.55);
        border-radius: 6px;
        pointer-events: none;
      }
      .leaf {
        position: absolute;
        height: var(--ph);
        z-index: 6;
        transform-style: preserve-3d;
        transition: transform 0.75s cubic-bezier(0.45, 0.05, 0.2, 1);
        will-change: transform;
      }
      .leaf .pg {
        position: absolute;
        inset: 0;
        width: auto;
        height: auto;
        flex: none;
        margin: 0;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
      }
      .leaf.h .face.b {
        transform: rotateY(180deg);
      }
      .leaf.v .face.b {
        transform: rotateX(180deg);
      }
      .leaf.h.fwd {
        top: var(--bp);
        left: 50%;
        width: calc(50% - var(--bp));
        transform-origin: left center;
      }
      .leaf.h.bwd {
        top: var(--bp);
        left: var(--bp);
        width: calc(50% - var(--bp));
        transform-origin: right center;
      }
      .leaf.v.fwd {
        left: var(--bp);
        right: var(--bp);
        top: calc(var(--bp) + var(--ph));
        transform-origin: center top;
      }
      .leaf.v.bwd {
        left: var(--bp);
        right: var(--bp);
        top: var(--bp);
        transform-origin: center bottom;
      }
      .cast {
        position: absolute;
        pointer-events: none;
        z-index: 5;
        opacity: 0;
        height: var(--ph);
      }
      .cast.h.fwd {
        top: var(--bp);
        left: 50%;
        width: calc(50% - var(--bp));
        background: linear-gradient(90deg, rgba(0, 0, 0, 0.4), transparent 70%);
      }
      .cast.h.bwd {
        top: var(--bp);
        left: var(--bp);
        width: calc(50% - var(--bp));
        background: linear-gradient(
          270deg,
          rgba(0, 0, 0, 0.4),
          transparent 70%
        );
      }
      .cast.v.fwd {
        left: var(--bp);
        right: var(--bp);
        top: calc(var(--bp) + var(--ph));
        background: linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.4),
          transparent 70%
        );
      }
      .cast.v.bwd {
        left: var(--bp);
        right: var(--bp);
        top: var(--bp);
        background: linear-gradient(0deg, rgba(0, 0, 0, 0.4), transparent 70%);
      }
      .cast.go {
        animation: castA 0.78s ease-in-out;
      }
      @keyframes castA {
        0% {
          opacity: 0;
        }
        45% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }
      .sw {
        display: none;
        gap: 6px;
        align-items: center;
      }
      .bar.s .sw {
        display: flex;
      }
      .sw i {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 2px solid transparent;
        cursor: pointer;
        background: var(--c);
        box-shadow: 0 0 0 1px var(--line);
      }
      .sw i.on {
        border-color: var(--ink);
      }
      .b-s[data-sc] {
        cursor: pointer;
      }
      .sp {
        margin: 8px 0 12px;
      }
      .sm {
        font-size: 12.5px;
        color: var(--mut);
      }
      .sline {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        margin-bottom: 12px;
        background: var(--card);
        font-size: 14px;
      }
      .sdot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex: none;
        background: #8a8a8a;
      }
      .sdot.k {
        background: #1fb980;
      }
      .sdot.a {
        background: #f0b429;
      }
      .sdot.r {
        background: #d9432a;
      }
      .schoice {
        border: 1px solid var(--red);
        border-radius: 10px;
        padding: 14px;
        margin-bottom: 8px;
      }
      .schoice p {
        margin: 4px 0 10px;
      }
      #fsb i {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 6px;
        vertical-align: middle;
      }
      .sheet.clean {
        background: var(--card);
        padding: 0;
        overflow: hidden;
      }
      .nw {
        display: grid;
        grid-template-columns: 260px 1fr;
        height: min(76vh, 640px);
      }
      .ns {
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        min-height: 0;
        padding: 16px 12px;
      }
      .nh {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
      }
      .nh h2 {
        margin: 0;
        font-size: 24px;
      }
      .nq {
        width: 100%;
        font: 400 14px var(--bd);
        color: var(--ink);
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px 12px;
        margin-bottom: 10px;
        outline: none;
      }
      .nq:focus {
        border-color: var(--red);
      }
      .nlist {
        overflow-y: auto;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .nl {
        display: flex;
        flex-direction: column;
        gap: 2px;
        text-align: left;
        background: none;
        border: 0;
        border-radius: 10px;
        padding: 10px 12px;
        cursor: pointer;
        color: var(--ink);
        font: inherit;
        transition: background 0.15s;
      }
      .nl:hover,
      .nl.on {
        background: var(--line);
      }
      .nl.on {
        box-shadow: inset 3px 0 0 var(--red);
      }
