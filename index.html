<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#e9e4d9;--grid:rgba(30,30,30,.07);--card:#f6f2e8;--ink:#171717;--mut:#6b655a;--line:rgba(0,0,0,.16);--cable:rgba(0,0,0,.09);--red:#d9432a;--grn:#0f5a43;--org:#ef8a2f;--ol:#5b6b46;--nk:#26366b;

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--grid:rgba(255,255,255,.05);--card:#1c1c1c;--ink:#efeae0;--mut:#9a948a;--line:rgba(255,255,255,.16);--cable:rgba(255,255,255,.1)}}
:root[data-theme="dark"]{--bg:#121212;--grid:rgba(255,255,255,.05);--card:#1c1c1c;--ink:#efeae0;--mut:#9a948a;--line:rgba(255,255,255,.16);--cable:rgba(255,255,255,.1)}
*{box-sizing:border-box;scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;font:15px/1.5 var(--bd);color:var(--ink);background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/32px 32px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/32px 32px,var(--bg)}
#bgc{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#bgc path{fill:none;stroke:var(--cable);stroke-width:3}
.w{position:relative;max-width:1120px;margin:auto;padding:0 20px 60px}
nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:16px 0}
.logo{width:34px;height:34px;border-radius:50% 50% 50% 8px;background:var(--red);color:#fff;font:800 18px/34px var(--hd);text-align:center;margin-right:8px;transform:rotate(-8deg)}
.dots{display:flex;gap:5px;margin-right:auto}.dots i{width:9px;height:9px;border-radius:50%}
nav button{font:500 14px var(--bd);color:var(--ink);background:none;border:0;padding:6px 12px;border-radius:20px;cursor:pointer;transition:background .2s}
nav button:hover{background:var(--line)}
nav button.pri{background:var(--ink);color:var(--bg)}
#hero{display:grid;grid-template-columns:1fr minmax(240px,320px);gap:30px;align-items:center;padding:20px 0 10px}
.tag{display:inline-block;font:400 12px var(--tw);border:1.5px solid var(--ink);padding:2px 10px;background:var(--card);text-transform:uppercase;transform:rotate(3deg);margin:0 6px 10px 0}
.tag+.tag{transform:rotate(-2deg)}
h1{margin:0;font:800 clamp(44px,8vw,88px)/.95 var(--hd);letter-spacing:-.03em}
h1 em{font-style:normal;color:var(--red)}
.lead{max-width:540px;color:var(--mut);margin:14px 0 18px}
#seg{display:flex;gap:4px;max-width:540px}
#seg i{height:8px;background:var(--line);position:relative;overflow:hidden;border-radius:1px}
#seg b{position:absolute;left:0;top:0;bottom:0;background:var(--pc);transition:width .4s}
#sg{font:400 12px var(--tw);color:var(--mut);margin-top:8px}
.cut{filter:drop-shadow(0 5px 7px rgba(0,0,0,.28))}
.cut .cp{background:var(--oc,var(--red));padding:7px;clip-path:polygon(var(--pl))}
.cut .in{background:#f6f2e8;color:#171717;padding:13px 14px 15px;clip-path:polygon(var(--pi))}
.nt{font:400 11px var(--tw);color:var(--oc,var(--red));text-transform:uppercase;letter-spacing:.04em}
.hd{font:800 17px/1.15 var(--hd);margin:2px 0 4px;letter-spacing:-.01em}
.in p{margin:4px 0 0;font-size:13.5px;line-height:1.4}
#nx{transform:rotate(1.5deg)}
.sec{display:flex;align-items:baseline;gap:12px;margin:34px 0 10px}
.sec h2{margin:0;font:800 28px var(--hd);letter-spacing:-.02em}
.sec span{color:var(--mut);font:400 12px var(--tw)}
#cork{position:relative;isolation:isolate;z-index:0;border:9px solid #0e2f25;border-radius:8px;touch-action:pan-y;background:linear-gradient(rgba(255,255,255,.34) 1px,transparent 1px) 0 0/120px 120px,linear-gradient(90deg,rgba(255,255,255,.34) 1px,transparent 1px) 0 0/120px 120px,linear-gradient(rgba(255,255,255,.13) 1px,transparent 1px) 0 0/24px 24px,linear-gradient(90deg,rgba(255,255,255,.13) 1px,transparent 1px) 0 0/24px 24px,radial-gradient(circle at 0 100%,transparent 139px,rgba(255,255,255,.3) 140px,transparent 142px,transparent 199px,rgba(255,255,255,.22) 200px,transparent 202px),radial-gradient(ellipse at 50% 30%,#2a7a5d,#1b5c46 70%);box-shadow:0 34px 50px -14px rgba(0,0,0,.6),0 3px 0 #0a2219,inset 0 0 0 2px rgba(255,255,255,.18),inset 0 0 60px rgba(0,0,0,.35)}
#cork:before,#cork:after{content:"";position:absolute;z-index:0;pointer-events:none;background-repeat:no-repeat}
#cork:before{left:0;right:0;top:0;height:14px;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.55) 0 1px,transparent 1px 12px),repeating-linear-gradient(90deg,rgba(255,255,255,.85) 0 1.5px,transparent 1.5px 60px);background-size:100% 6px,100% 12px}
#cork:after{left:0;top:0;bottom:0;width:14px;background-image:repeating-linear-gradient(180deg,rgba(255,255,255,.55) 0 1px,transparent 1px 12px),repeating-linear-gradient(180deg,rgba(255,255,255,.85) 0 1.5px,transparent 1.5px 60px);background-size:6px 100%,12px 100%}
.mcap{position:absolute;right:16px;bottom:10px;font:400 11px var(--tw);color:rgba(255,255,255,.55);letter-spacing:.08em;text-transform:uppercase;pointer-events:none}
.note{position:absolute;z-index:1;transform:rotate(var(--r));cursor:grab;transition:transform .15s;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.note:hover{transform:rotate(0) scale(1.04);z-index:3}
.note.drag{cursor:grabbing;transform:rotate(0) scale(1.07)}
.note .in{user-select:none}
.nx{position:absolute;right:12px;top:10px;font:12px var(--bd);cursor:pointer;opacity:0;z-index:2;text-decoration:none;color:#171717}
.note:hover .nx{opacity:.7}
.r{--oc:var(--red)}.g{--oc:var(--grn)}.o{--oc:var(--org)}.l{--oc:var(--ol)}.k{--oc:#171717}
.note.g{--oc:#ece3c3}.note.l{--oc:#c5d16d}.note .nt{color:#6b5a4a}
#ov{position:fixed;inset:0;background:rgba(10,10,10,.5);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s;padding:calc(12px + env(safe-area-inset-top,0px)) 10px 12px;z-index:100}
#ov.on{opacity:1;pointer-events:auto}
#pn{max-height:100%;overflow:auto;width:min(96vw,940px);transform:translateY(30px) rotate(-.8deg) scale(.97);transition:transform .4s cubic-bezier(.2,.9,.3,1.1)}
#ov.on #pn{transform:none}
#x{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:14px;z-index:101;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:50%;width:38px;height:38px;font-size:16px;cursor:pointer}
.sheet{background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/24px 24px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/24px 24px,var(--card);border:1px solid var(--line);border-radius:4px;padding:22px 24px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.sheet h2{margin:0 0 4px;font:800 30px var(--hd);letter-spacing:-.02em}
.sub{color:var(--mut);font:400 12px var(--tw);margin-bottom:14px}
body{overflow-x:hidden}
.note{max-width:260px}
#cork.cmp .cut .cp{padding:5px}
#cork.cmp .cut .in{padding:8px 9px 10px}
#cork.cmp .hd{font-size:12.5px;margin:1px 0 2px}
#cork.cmp .in p{font-size:10.5px;line-height:1.3}
#cork.cmp .nt{font-size:8.5px}
.book{--bp:16px;position:relative;perspective:1800px;display:flex;padding:var(--bp);border-radius:8px;box-shadow:0 24px 60px rgba(0,0,0,.45);background:radial-gradient(circle at 9px 9px,#e0b85a 3px,transparent 4px),radial-gradient(circle at calc(100% - 9px) 9px,#e0b85a 3px,transparent 4px),radial-gradient(circle at 9px calc(100% - 9px),#e0b85a 3px,transparent 4px),radial-gradient(circle at calc(100% - 9px) calc(100% - 9px),#e0b85a 3px,transparent 4px),linear-gradient(90deg,transparent calc(100% - 13px),#a3281c calc(100% - 13px),#7e1d14 calc(100% - 5px),transparent calc(100% - 5px)),repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 2px,transparent 2px 5px),#0f3d30}
.book:before{content:"";position:absolute;inset:5px;border:2px dashed rgba(224,184,90,.55);border-radius:6px;pointer-events:none}
.leaf{position:absolute;height:var(--ph);z-index:6;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.45,.05,.2,1);will-change:transform}
.leaf .pg{position:absolute;inset:0;width:auto;height:auto;flex:none;margin:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.leaf.h .face.b{transform:rotateY(180deg)}.leaf.v .face.b{transform:rotateX(180deg)}
.leaf.h.fwd{top:var(--bp);left:50%;width:calc(50% - var(--bp));transform-origin:left center}
.leaf.h.bwd{top:var(--bp);left:var(--bp);width:calc(50% - var(--bp));transform-origin:right center}
.leaf.v.fwd{left:var(--bp);right:var(--bp);top:calc(var(--bp) + var(--ph));transform-origin:center top}
.leaf.v.bwd{left:var(--bp);right:var(--bp);top:var(--bp);transform-origin:center bottom}
.cast{position:absolute;pointer-events:none;z-index:5;opacity:0;height:var(--ph)}
.cast.h.fwd{top:var(--bp);left:50%;width:calc(50% - var(--bp));background:linear-gradient(90deg,rgba(0,0,0,.4),transparent 70%)}
.cast.h.bwd{top:var(--bp);left:var(--bp);width:calc(50% - var(--bp));background:linear-gradient(270deg,rgba(0,0,0,.4),transparent 70%)}
.cast.v.fwd{left:var(--bp);right:var(--bp);top:calc(var(--bp) + var(--ph));background:linear-gradient(180deg,rgba(0,0,0,.4),transparent 70%)}
.cast.v.bwd{left:var(--bp);right:var(--bp);top:var(--bp);background:linear-gradient(0deg,rgba(0,0,0,.4),transparent 70%)}
.cast.go{animation:castA .78s ease-in-out}
@keyframes castA{0%{opacity:0}45%{opacity:1}100%{opacity:0}}
.gs{margin:0 0 14px;padding-left:20px}.gs li{margin:6px 0}
.gp{width:100%;font:12px/1.5 var(--tw);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:4px;padding:10px;resize:vertical}
.gr{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 0 6px}.gr b{font:800 16px var(--hd)}
.pg{flex:1;height:var(--ph,560px);overflow-x:hidden;overflow-y:auto;min-height:0;background:radial-gradient(rgba(38,54,107,.18) 1px,transparent 1.3px) 0 0/20px 20px,#f4efe2;color:var(--nk);padding:24px 28px 32px;position:relative;font:500 22px/1.3 var(--hw)}
.pg.l{border-radius:3px 0 0 3px;box-shadow:inset -30px 0 26px -22px rgba(0,0,0,.4)}
.pg.r{border-radius:0 3px 3px 0;box-shadow:inset 30px 0 26px -22px rgba(0,0,0,.4);transform-origin:left center}
.pg.r.fl{transform:rotateY(-90deg);transition:transform .3s ease-in}
.pg.r.fl2{animation:unf .35s ease-out}
@keyframes unf{from{transform:rotateY(90deg)}}
.b-h{font:700 36px/1.05 var(--hw);margin:6px 0;position:relative}
.b-sh{font:700 26px/1.1 var(--hw);color:#8a3b2a;margin:6px 0;position:relative}
.b-d{display:inline-block;font:400 12px var(--tw);border:1.5px solid var(--nk);padding:1px 8px;transform:rotate(-2deg);margin:4px 8px 4px 0;text-transform:uppercase;position:relative}
.b-ph{display:inline-block;font:400 12px var(--tw);background:var(--red);color:#fff;padding:1px 10px;border-radius:2px;margin:2px 8px 2px 0;text-transform:uppercase;transform:rotate(-1.5deg);position:relative}
.b-t{margin:4px 0;position:relative}
.b-s{background:#ffe27a;color:#2a2118;font-size:20px;line-height:1.2;padding:10px 14px;transform:rotate(-1.5deg);box-shadow:0 4px 8px rgba(0,0,0,.22);margin:12px 0;position:relative}
.b-s:nth-of-type(odd){transform:rotate(1.2deg)}
.cnt{margin-top:10px;color:#1f7a4d}
.t{display:flex;gap:10px;cursor:pointer;position:relative;margin:4px 0}
.t input{position:absolute;opacity:0;pointer-events:none}
.bx{flex:none;width:19px;height:19px;border:2px solid currentColor;border-radius:4px 7px 5px 6px;margin-top:6px;position:relative}
.bx:after{content:"✔";position:absolute;left:1px;top:-10px;font-size:25px;color:#1f7a4d;transform:scale(0) rotate(-30deg);transition:transform .25s cubic-bezier(.3,1.8,.5,1)}
.t.done .bx:after{transform:scale(1)}
.tx{background:linear-gradient(currentColor,currentColor) no-repeat 0 58%/0 2px;transition:background-size .4s,opacity .4s}
.t.done .tx{background-size:100% 2px;opacity:.38}
.tx em{font-style:normal;color:#b0281c;margin-right:6px}
.bl{width:19px;text-align:center;flex:none}
.ed{margin-left:auto;font:12px var(--bd);opacity:0;cursor:pointer;text-decoration:none;color:#b0281c;padding-left:8px}
.pg *:hover>.ed,.pg .ed:hover{opacity:.9}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.bar select,.bar input,.frm input,.frm textarea{font:400 14px var(--bd);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:4px;padding:7px 10px}
.bar input{flex:1;min-width:140px}
.btn{font:500 14px var(--bd);background:var(--ink);color:var(--bg);border:0;border-radius:4px;padding:7px 14px;cursor:pointer}
.btn.gh{background:none;color:var(--ink);border:1px solid var(--line)}
.nv{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:12px;font:400 13px var(--tw);color:#f4efe2}
.nv button{font:inherit;background:none;border:1px solid #f4efe2;color:#f4efe2;border-radius:4px;padding:2px 14px;cursor:pointer}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.fc{position:relative;text-align:left;font:inherit;color:var(--ink);cursor:pointer;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--pc);border-radius:2px 6px 4px 4px;padding:26px 12px 12px;min-height:116px;display:flex;flex-direction:column;gap:4px;transition:transform .2s,box-shadow .2s,opacity .3s}
.fc:hover{transform:translateY(-4px);box-shadow:0 10px 18px rgba(0,0,0,.2)}
.fc .tab{position:absolute;left:10px;top:-4px;background:var(--pc);color:#fff;font:400 10px var(--tw);padding:2px 9px;text-transform:uppercase;border-radius:0 0 4px 4px}
.fc .fd{font:400 11px var(--tw);color:var(--mut)}
.fc .ft{font-weight:500;font-size:13.5px;line-height:1.35}

.fc .stp{display:none;position:absolute;right:8px;bottom:8px;font:400 12px var(--tw);color:var(--red);border:2px solid var(--red);padding:0 6px;transform:rotate(-8deg)}

.ph2 small{color:var(--mut);font:400 12px var(--tw);display:block}
.pb{height:5px;background:var(--line);margin:8px 0}.pb i{display:block;height:100%;background:var(--pc)}
.out{font:400 12px var(--tw);color:var(--pc);margin-bottom:6px}
.tr{display:flex;gap:10px;font-size:13.5px;padding:2px 0}.tr .d{flex:none;width:96px;font:400 11px/1.9 var(--tw);color:var(--mut)}

.ck input{margin-top:4px;accent-color:var(--red);width:16px;height:16px}
.ck .d{flex:none;width:100px;font:400 11px/1.9 var(--tw);color:var(--mut)}
.ck.done span:last-child{opacity:.4;text-decoration:line-through}
.pol{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:20px;margin-top:22px}
.rg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}

.wm{font:800 15px var(--hd);letter-spacing:-.01em;margin-right:12px}

.tag.cls{background:var(--red);color:#fff;border-color:var(--red)}
